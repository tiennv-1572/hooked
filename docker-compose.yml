# Chỉ dùng cho local development.
# Next.js chạy trực tiếp trên máy (npm run dev), Docker chỉ lo phần MySQL.
services:
  mysql:
    image: mysql:8.4
    container_name: hooked-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hooked}
      MYSQL_USER: ${MYSQL_USER:-hooked}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hooked}
      TZ: Asia/Ho_Chi_Minh
    ports:
      # 3307 mặc định để không đụng MySQL/SSH tunnel đang chiếm 3306 trên máy.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Chỉ chạy khi volume được tạo lần đầu (xem README nếu cần chạy lại)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # UI xem DB cho nhanh. Không chạy mặc định:
  #   docker compose --profile tools up -d
  adminer:
    image: adminer:latest
    container_name: hooked-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
